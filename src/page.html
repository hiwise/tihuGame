</div>
<header class="top">
<div class="logo"><span>➤</span><div><strong>鹈鹕快递</strong><small>PELICAN POST CLUB</small></div></div>
<div id="progress" class="progress" hidden><div><b id="routeLabel"></b><span id="meter"></span></div><div class="bar"><i id="fill"></i></div></div>
<nav><button id="cam" hidden>◉ 追尾</button><button id="sound" aria-label="开关音效">♪</button><button id="pause" hidden aria-label="暂停">Ⅱ</button></nav>
</header>
<div id="raceFx" hidden aria-hidden="true"></div><aside id="racePanel" class="racePanel" hidden><b id="racePlace"></b><span id="raceTime"></span><small id="raceStatus"></small><span id="raceBoost"></span></aside><div id="raceCount" class="raceCount" aria-live="polite" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="flash" class="flash"></div>
<div class="dash" id="dash" hidden><div class="metrics"><span>速度<strong id="speed"></strong></span><span>船票<strong id="coins"></strong></span><span>耐久<strong id="hearts"></strong></span></div><div class="skill" id="skill"></div><button id="use" class="slot"><b id="item"></b><small id="hint"></small></button></div>
<div id="touch" class="touch" hidden><div><button data-key="ArrowLeft" aria-label="左转">←</button><button data-key="ArrowRight" aria-label="右转">→</button></div><div><button data-key="ArrowDown">刹车</button><button data-key="ArrowUp">加速</button><button data-key="action" class="accent">特技</button></div></div>
<section id="garage" class="garage" aria-label="车库和试衣间">
<div class="garageCard">
<div class="stamp"><span>珊瑚湾邮局 / 海岸运输部</span><span>档案 01</span></div>
<h1 id="garageTitle">今日派送<em>选好装备，就出发。</em></h1>
<div class="tabs" role="tablist" aria-label="车库页面"><button data-tab="pilot">01 角色</button><button data-tab="map">02 地图</button><button data-tab="vehicle">03 载具</button></div>
<div id="garageContent"></div>
<div class="garageFoot"><button class="primary" id="next"></button><button class="raceEntry" id="raceEntry" hidden></button><small id="garageHint">键盘与触控 · 可完全离线游玩</small></div>
</div>
<div class="lobbyFrame" aria-hidden="true"><div class="lobbyTop"><span id="lobbyKicker">OPERATIONS / 01</span><i></i><span id="lobbyZone">珊瑚湾空勤站</span></div><div class="lobbySide" id="lobbySide">PELICAN POST / FLIGHT DIVISION</div><div class="lobbyFloor"><b></b><b></b><b></b><b></b></div></div><div class="yesCaption" id="yesCaption" role="status" hidden><small>角色回应</small><strong>Yes!</strong></div>
<div id="orbitPad" class="orbitPad" aria-hidden="true"></div><div class="showcase"><div class="showTag"><small id="stageTag"></small><b id="stageTitle"></b><span id="stageCopy"></span></div><div class="spin"><button id="saluteReplay" type="button">敬礼</button><button id="refView" type="button" aria-label="切换正交参考视角">三视图</button><button id="spinL" aria-label="向左旋转">↶</button><button id="spinR" aria-label="向右旋转">↷</button></div></div>
</section>
<section id="modal" class="overlay" hidden><div class="result"><div class="stamp"><span>PELICAN POST / 派送档案</span><span id="grade"></span></div><h2 id="resultTitle"></h2><p id="resultCopy"></p><div id="resultStats" class="stats"></div><p id="resultExtra"></p><button id="again" class="primary"></button><button id="back" class="secondary">返回邮局车库</button></div></section>
</main>

</body></html>
